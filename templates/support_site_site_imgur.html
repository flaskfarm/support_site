<script type="text/javascript">
(function() {
  var fragment = location.hash.substring(1);
  history.replaceState(null, '', location.pathname + location.search);
  var params = new URLSearchParams(fragment);
  var body = new URLSearchParams({command: 'imgur_auth_complete'});
  ['state', 'access_token', 'refresh_token', 'account_username', 'account_id'].forEach(function(key) {
    body.set(key, params.get(key) || '');
  });
  var req = new XMLHttpRequest();
  req.open('POST', '/support_site/ajax/site/command', true);
  req.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
  req.onreadystatechange = function() {
    if (req.readyState === 4) {
      var succeeded = false;
      try { succeeded = req.status === 200 && JSON.parse(req.responseText).ret === 'success'; }
      catch (e) { /* 로그인 페이지 등 JSON이 아닌 응답도 인증 실패로 처리한다. */ }
      alert(succeeded ? 'Imgur 인증 정보를 저장했습니다. 설정을 새로고침하세요.' :
        'Imgur 인증에 실패했습니다. 설정에서 다시 인증하세요.');
      window.close();
    }
  };
  req.send(body.toString());
})();
</script>
